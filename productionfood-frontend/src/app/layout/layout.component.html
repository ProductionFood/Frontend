<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <img src="/logos/isotipo-claro.svg" alt="ProductionFood">
      <span>ProductionFood</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/app/dashboard">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a
        mat-list-item
        routerLink="/app/usuarios"
        *siRol="['ADMIN']"
      >
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Usuarios</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      <button
        mat-icon-button
        type="button"
        (click)="sidenav.toggle()"
        aria-label="Mostrar u ocultar menú"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <span class="toolbar-title">Gestión de producción</span>

      <span class="spacer"></span>

      <button
        mat-button
        [matMenuTriggerFor]="userMenu"
        aria-label="Abrir menú de usuario"
      >
        <mat-icon>account_circle</mat-icon>
        {{ authService.usuario()?.nombre ?? 'Usuario' }}
        <mat-icon>expand_more</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <div class="user-info">
          <strong>{{ authService.usuario()?.nombre }}</strong>
          <small>{{ authService.usuario()?.correo }}</small>
        </div>
        <button mat-menu-item type="button" (click)="cerrarSesion()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
