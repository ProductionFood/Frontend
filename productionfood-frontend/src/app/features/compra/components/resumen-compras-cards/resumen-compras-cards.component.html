<app-kpi-card
  etiqueta="Gasto ejecutado"
  [valor]="(resumen().gastoEjecutado | currency: 'COP' : 'symbol-narrow' : '1.2-2') ?? ''"
  tonoValor="verde"
>
  <p class="detalle">{{ resumen().recibidas.cantidad }} recibidas</p>
</app-kpi-card>

<app-kpi-card
  etiqueta="Comprometido"
  [valor]="(resumen().gastoComprometido | currency: 'COP' : 'symbol-narrow' : '1.2-2') ?? ''"
  tonoValor="naranja"
>
  <p class="detalle">{{ resumen().pendientes.cantidad }} pendientes</p>
</app-kpi-card>

<app-kpi-card etiqueta="Compras" [valor]="totalCompras()">
  <p class="detalle">{{ resumen().canceladas.cantidad }} canceladas</p>
</app-kpi-card>
