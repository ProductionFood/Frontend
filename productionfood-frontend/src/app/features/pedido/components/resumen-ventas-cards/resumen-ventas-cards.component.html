<app-kpi-card
  etiqueta="Venta neta"
  [valor]="(resumen().ventaNeta | currency: 'COP' : 'symbol-narrow' : '1.2-2') ?? ''"
  tonoValor="verde"
>
  <p class="detalle">
    {{ resumen().entregados.cantidad }} entregados
    · {{ resumen().cancelados.cantidad }} cancelados
  </p>
</app-kpi-card>

<app-kpi-card
  etiqueta="Comprometido"
  [valor]="(resumen().enCurso.total | currency: 'COP' : 'symbol-narrow' : '1.2-2') ?? ''"
  tonoValor="azul"
>
  <p class="detalle">{{ resumen().enCurso.cantidad }} en curso</p>
</app-kpi-card>

<app-kpi-card
  etiqueta="Devoluciones"
  [valor]="(resumen().devoluciones | currency: 'COP' : 'symbol-narrow' : '1.2-2') ?? ''"
  [tonoValor]="tieneDevoluciones() ? 'naranja' : null"
>
  <p class="detalle" [class.detalle--atencion]="tieneDevoluciones()">
    <span class="punto" aria-hidden="true"></span>
    {{ porcentajeDevoluciones() | number: '1.1-1' }} % sobre
    {{ (resumen().ventaBruta | currency: 'COP' : 'symbol-narrow' : '1.0-0') }}
    bruto
  </p>
</app-kpi-card>

<app-kpi-card
  etiqueta="Ticket promedio"
  [valor]="(resumen().ticketPromedio | currency: 'COP' : 'symbol-narrow' : '1.2-2') ?? ''"
>
  <p class="detalle">por pedido entregado</p>
</app-kpi-card>
