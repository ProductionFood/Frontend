<header class="page-header">
  <p class="subtitulo">
    Analiza la operación y detecta desviaciones. Cada reporte abre con el
    período en curso.
  </p>

  <button mat-flat-button color="primary" type="button" (click)="generar()">
    <mat-icon>summarize</mat-icon>
    Generar reporte
  </button>
</header>

<h2 class="seccion-titulo">Tipos de reporte</h2>

<div class="reportes-grid">
  @for (reporte of reportes; track reporte.ruta) {
    <article class="reporte-card">
      <span [class]="'reporte-icono ' + reporte.tono">
        <mat-icon>{{ reporte.icono }}</mat-icon>
      </span>

      <h3>{{ reporte.titulo }}</h3>
      <p class="descripcion">{{ reporte.descripcion }}</p>

      <footer class="reporte-pie">
        <span class="meta">{{ reporte.hu }}</span>
        <a mat-button [routerLink]="reporte.ruta">
          Abrir
          <mat-icon iconPositionEnd>arrow_forward</mat-icon>
        </a>
      </footer>
    </article>
  }
</div>
