<header class="page-header">
  <p>Administra los clientes y sus datos de contacto.</p>
  <button mat-flat-button type="button" *siRol="['ADMIN', 'VENTAS']" (click)="abrirFormulario()">
    <mat-icon>add</mat-icon> Nuevo cliente
  </button>
</header>

<section class="filtros" aria-label="Filtros de clientes">
  <mat-form-field appearance="outline" class="filtro-busqueda">
    <mat-icon matPrefix>search</mat-icon>
    <mat-label>Buscar por nombre</mat-label>
    <input matInput [formControl]="filtros.controls.busqueda" autocomplete="off" />
    @if (filtros.controls.busqueda.value) {
      <button mat-icon-button matSuffix type="button" aria-label="Limpiar búsqueda" (click)="filtros.controls.busqueda.setValue('')"><mat-icon>close</mat-icon></button>
    }
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Estado</mat-label>
    <mat-select [formControl]="filtros.controls.activo">
      <mat-option [value]="null">Todos</mat-option>
      <mat-option [value]="true">Activos</mat-option>
      <mat-option [value]="false">Inactivos</mat-option>
    </mat-select>
  </mat-form-field>
</section>

<app-tabla-paginada
  [columnas]="columnas" [datos]="clientes()" [total]="total()"
  [page]="pagina()" [size]="tamano()" [cargando]="cargando()" [error]="error()"
  mensajeVacio="No hay clientes registrados."
  (cambiarPagina)="onPagina($event)" (cambiarOrden)="onOrden($event)" (reintentar)="recargar()"
>
  <ng-template appTablaColumna="nombre" let-cliente>{{ cliente.nombre }}</ng-template>
  <ng-template appTablaColumna="contacto" let-cliente>{{ cliente.contacto || '—' }}</ng-template>
  <ng-template appTablaColumna="telefono" let-cliente>{{ cliente.telefono || '—' }}</ng-template>
  <ng-template appTablaColumna="estado" let-cliente>
    <span class="chip-estado" [class.activo]="cliente.activo" [class.inactivo]="!cliente.activo">
      <span class="punto"></span>{{ cliente.activo ? 'Activo' : 'Inactivo' }}
    </span>
  </ng-template>
  <ng-template appTablaColumna="acciones" let-cliente>
    <button mat-icon-button type="button" [matMenuTriggerFor]="menuCliente" [attr.aria-label]="'Acciones para ' + cliente.nombre"><mat-icon>more_vert</mat-icon></button>
    <mat-menu #menuCliente="matMenu">
      <button mat-menu-item type="button" *siRol="['ADMIN', 'VENTAS']" (click)="abrirFormulario(cliente)"><mat-icon>edit</mat-icon><span>Editar</span></button>
      <button mat-menu-item type="button" *siRol="['ADMIN', 'VENTAS']" (click)="cambiarEstado(cliente)"><mat-icon>{{ cliente.activo ? 'person_off' : 'person_check' }}</mat-icon><span>{{ cliente.activo ? 'Desactivar' : 'Activar' }}</span></button>
    </mat-menu>
  </ng-template>
</app-tabla-paginada>
