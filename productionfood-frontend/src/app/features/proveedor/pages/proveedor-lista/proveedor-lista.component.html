<header class="page-header">
  <div>
    <h1 class="titulo-pagina">Proveedores</h1>
    <p>Administra los proveedores y sus datos de contacto.</p>
  </div>
  <button mat-flat-button type="button" *siRol="['ADMIN', 'COMPRAS']" (click)="abrirFormulario()">
    <mat-icon>add</mat-icon> Nuevo proveedor
  </button>
</header>

<app-kpis-catalogo
  etiquetaTotal="Proveedores"
  etiquetaActivos="Activos"
  etiquetaInactivos="Inactivos"
  icono="local_shipping"
  [total]="kpiTotal()"
  [activos]="kpiActivos()"
  [inactivos]="kpiInactivos()"
  [cargando]="cargandoKpis()"
/>

<section class="filtros" aria-label="Filtros de proveedores">
  <app-filtro-busqueda etiqueta="Buscar por nombre" [control]="filtros.controls.busqueda" />
  <mat-form-field appearance="outline">
    <mat-label>Estado</mat-label>
    <mat-select [formControl]="filtros.controls.activo">
      <mat-option [value]="null">Todos</mat-option>
      <mat-option [value]="true">Activos</mat-option>
      <mat-option [value]="false">Inactivos</mat-option>
    </mat-select>
  </mat-form-field>
</section>

<app-tabla-paginada
  [columnas]="columnas" [datos]="proveedores()" [total]="total()"
  [page]="pagina()" [size]="tamano()" [cargando]="cargando()" [error]="error()"
  [mensajeVacio]="filtroAplicado() ? 'Ningún proveedor coincide con los filtros.' : 'No hay proveedores registrados.'"
  (cambiarPagina)="onPagina($event)" (cambiarOrden)="onOrden($event)" (reintentar)="recargar()"
>
  <ng-template appTablaColumna="nombre" let-proveedor>{{ proveedor.nombre }}</ng-template>
  <ng-template appTablaColumna="contacto" let-proveedor>{{ proveedor.contacto || '—' }}</ng-template>
  <ng-template appTablaColumna="telefono" let-proveedor>{{ proveedor.telefono || '—' }}</ng-template>
  <ng-template appTablaColumna="correo" let-proveedor>
    @if (proveedor.correo) {
      <a class="correo-proveedor" [href]="'mailto:' + proveedor.correo"><mat-icon aria-hidden="true">mail</mat-icon><span>{{ proveedor.correo }}</span></a>
    } @else { <span>—</span> }
  </ng-template>
  <ng-template appTablaColumna="estado" let-proveedor>
    <span class="chip-estado" [class.activo]="proveedor.activo" [class.inactivo]="!proveedor.activo">
      <span class="punto"></span>{{ proveedor.activo ? 'Activo' : 'Inactivo' }}
    </span>
  </ng-template>
  <ng-template appTablaColumna="acciones" let-proveedor>
    <button mat-icon-button type="button" [matMenuTriggerFor]="menuProveedor" [attr.aria-label]="'Acciones para ' + proveedor.nombre"><mat-icon>more_vert</mat-icon></button>
    <mat-menu #menuProveedor="matMenu">
      <button mat-menu-item type="button" *siRol="['ADMIN', 'COMPRAS']" (click)="abrirFormulario(proveedor)"><mat-icon>edit</mat-icon><span>Editar</span></button>
      <button mat-menu-item type="button" *siRol="['ADMIN', 'COMPRAS']" (click)="cambiarEstado(proveedor)"><mat-icon>{{ proveedor.activo ? 'person_off' : 'person_check' }}</mat-icon><span>{{ proveedor.activo ? 'Desactivar' : 'Activar' }}</span></button>
    </mat-menu>
  </ng-template>
</app-tabla-paginada>
