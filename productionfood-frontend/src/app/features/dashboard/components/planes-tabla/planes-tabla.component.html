<app-tarjeta-tabla titulo="Últimos planes de producción" [contador]="datos().length + (datos().length === 1 ? ' plan' : ' planes')">
  @if (datos().length === 0) {
    <div class="empty-state">
      <mat-icon>event_busy</mat-icon>
      <p>No hay planes de producción recientes</p>
    </div>
  } @else {
    <div class="tabla-scroll">
      <table mat-table [dataSource]="datos()" class="tabla-planes">
        <ng-container matColumnDef="numero">
          <th mat-header-cell *matHeaderCellDef>N.º</th>
          <td mat-cell *matCellDef="let p" class="plan-id">#{{ p.idPlanProduccion }}</td>
        </ng-container>

        <ng-container matColumnDef="producto">
          <th mat-header-cell *matHeaderCellDef>Producto</th>
          <td mat-cell *matCellDef="let p">{{ p.producto }}</td>
        </ng-container>

        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>Producción</th>
          <td mat-cell *matCellDef="let p">{{ p.fechaProduccion | date: 'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="fechaFin">
          <th mat-header-cell *matHeaderCellDef>Fin</th>
          <td mat-cell *matCellDef="let p">{{ p.fechaFin | date: 'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let p">
            <app-estado-badge [texto]="textoEstado(p.estado)" [tono]="tonoEstado(p.estado)" />
          </td>
        </ng-container>

        <ng-container matColumnDef="cantidad">
          <th mat-header-cell *matHeaderCellDef>Cantidad</th>
          <td mat-cell *matCellDef="let p" class="cantidad">{{ p.cantidad }} und</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let p">
            <a mat-button [routerLink]="['/app/produccion', p.idPlanProduccion]">Ver</a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas"></tr>
      </table>
    </div>
  }
</app-tarjeta-tabla>
