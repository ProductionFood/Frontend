<section class="dashboard">
  <header class="page-header">
    <div>
      <h1>Resumen del día</h1>
      <p class="fecha">{{ fechaMostrada() | date: 'fullDate' }}</p>
    </div>
    <div class="actualizacion">
      <span class="marca-hora" aria-live="polite">
        @if (actualizadoEn(); as marca) {
          Actualizado {{ marca | date: 'HH:mm' }}
        } @else {
          Consultando…
        }
      </span>
      <button
        mat-icon-button
        type="button"
        aria-label="Actualizar resumen"
        (click)="recargar()"
      >
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
  </header>

  <section class="kpis-catalogo" aria-label="Resumen de catálogos">
    <a
      *siRol="['ADMIN', 'VENTAS', 'PRODUCCION', 'CONSULTA']"
      class="kpi-enlace"
      routerLink="/app/productos"
    >
      <app-kpi-card
        etiqueta="Productos"
        [valor]="cargandoConteos() ? '—' : (conteos()?.productos ?? '—')"
        icono="inventory_2"
      />
    </a>

    <a
      *siRol="['ADMIN', 'PRODUCCION', 'COMPRAS', 'CONSULTA']"
      class="kpi-enlace"
      routerLink="/app/materias-primas"
    >
      <app-kpi-card
        etiqueta="Materias primas"
        [valor]="cargandoConteos() ? '—' : (conteos()?.materiasPrimas ?? '—')"
        icono="category"
      />
    </a>

    <a
      *siRol="['ADMIN', 'PRODUCCION', 'CONSULTA']"
      class="kpi-enlace"
      routerLink="/app/recetas"
    >
      <app-kpi-card
        etiqueta="Recetas"
        [valor]="cargandoConteos() ? '—' : (conteos()?.recetas ?? '—')"
        icono="menu_book"
      />
    </a>

    <a
      *siRol="['ADMIN', 'PRODUCCION', 'CONSULTA']"
      class="kpi-enlace"
      routerLink="/app/produccion"
    >
      <app-kpi-card
        etiqueta="Planes de producción"
        [valor]="cargandoConteos() ? '—' : (conteos()?.planes ?? '—')"
        icono="precision_manufacturing"
      />
    </a>

    <a
      *siRol="['ADMIN', 'PRODUCCION', 'COMPRAS', 'CONSULTA']"
      class="kpi-enlace"
      routerLink="/app/inventario"
    >
      <app-kpi-card
        etiqueta="Inventario"
        [valor]="cargandoConteos() ? '—' : (conteos()?.inventario ?? '—')"
        icono="warehouse"
      >
        <span class="kpi-nota">materias primas</span>
      </app-kpi-card>
    </a>
  </section>

  <div class="tarjetas">
    <app-tarjeta-vencimientos
      *siRol="['ADMIN', 'VENTAS', 'PRODUCCION', 'CONSULTA']"
      [datos]="porVencer()"
      [cargando]="cargandoVencimientos()"
      [error]="errorVencimientos()"
      (reintentar)="cargarVencimientos()"
    />
    <app-tarjeta-stock
      *siRol="['ADMIN', 'COMPRAS', 'PRODUCCION', 'CONSULTA']"
      [datos]="resumen()?.stockBajo ?? null"
      [cargando]="cargandoResumen()"
      [error]="errorResumen()"
      (reintentar)="cargarResumen()"
    />
    <app-tarjeta-pedidos
      *siRol="['ADMIN', 'VENTAS', 'CONSULTA']"
      [datos]="resumen()?.pedidosHoy ?? null"
      [cargando]="cargandoResumen()"
      [error]="errorResumen()"
      (reintentar)="cargarResumen()"
    />
    <app-tarjeta-compras
      *siRol="['ADMIN', 'COMPRAS', 'CONSULTA']"
      [datos]="resumen()?.comprasPendientes ?? null"
      [cargando]="cargandoResumen()"
      [error]="errorResumen()"
      (reintentar)="cargarResumen()"
    />
    <app-tarjeta-produccion
      *siRol="['ADMIN', 'PRODUCCION', 'CONSULTA']"
      [datos]="resumen()?.produccionHoy ?? null"
      [cargando]="cargandoResumen()"
      [error]="errorResumen()"
      (reintentar)="cargarResumen()"
    />
  </div>
</section>
