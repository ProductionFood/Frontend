<div class="tabla-contenedor">
  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" aria-label="Cargando" />
  }

  @if (error()) {
    <div class="estado">
      <mat-icon>error_outline</mat-icon>
      <p>{{ error() }}</p>
      <button mat-stroked-button type="button" (click)="reintentar.emit()">
        Reintentar
      </button>
    </div>
  } @else if (!cargando() && datos().length === 0) {
    <div class="estado">
      <mat-icon>inbox</mat-icon>
      <p>{{ mensajeVacio() }}</p>
    </div>
  } @else {
    <div class="tabla-scroll">
      <table
        mat-table
        [dataSource]="datos()"
        matSort
        (matSortChange)="cambiarOrden.emit($event)"
      >
        @for (col of columnas(); track col.id) {
          <ng-container [matColumnDef]="col.id">
            <th
              mat-header-cell
              *matHeaderCellDef
              mat-sort-header
              [disabled]="col.ordenable === false"
            >
              {{ col.titulo }}
            </th>
            <td mat-cell *matCellDef="let fila" [class]="col.clase">
              @if (plantilla(col.id); as tpl) {
                <ng-container
                  *ngTemplateOutlet="tpl; context: { $implicit: fila }"
                />
              } @else {
                {{ $any(fila)[col.id] }}
              }
            </td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="columnasIds()"></tr>
        <tr mat-row *matRowDef="let fila; columns: columnasIds()"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="total()"
      [pageIndex]="page()"
      [pageSize]="size()"
      [pageSizeOptions]="opcionesTamano()"
      (page)="cambiarPagina.emit($event)"
    />
  }
</div>
