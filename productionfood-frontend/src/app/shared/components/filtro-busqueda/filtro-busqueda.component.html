<mat-form-field appearance="outline" class="campo">
  <mat-icon matPrefix>{{ icono() }}</mat-icon>
  <mat-label>{{ etiqueta() }}</mat-label>
  <input matInput [formControl]="control()" [matAutocomplete]="autocompletar" autocomplete="off" />
  @if (control().value) {
    <button
      mat-icon-button
      matSuffix
      type="button"
      [attr.aria-label]="'Limpiar ' + etiqueta()"
      (click)="limpiar()"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>

<mat-autocomplete #autocompletar="matAutocomplete">
  @for (opcion of opciones(); track opcion) {
    <mat-option [value]="opcion">{{ opcion }}</mat-option>
  }
</mat-autocomplete>
